# Marvel Rivals
export SteamDeck=1
SCB_NOSCOPE=1
SCB_GAMESCOPE_ARGS+=" --borderless --adaptive-sync"

# Marvel Rivals is still installed on the /mnt/games NTFS Steam library. Proton-CachyOS
# creates/reads real Unix symlinks in pfx/dosdevices (especially s: for the game
# drive); the NTFS prefix stores those as Windows/IntxLNK-style files, which makes
# Proton abort with readlink/symlink EINVAL during setup. Keep only this game's
# compatdata prefix on the native Linux filesystem; the game install remains on
# /mnt/games.
export STEAM_COMPAT_DATA_PATH="$HOME/.local/share/Steam/steamapps/compatdata/2767030"
